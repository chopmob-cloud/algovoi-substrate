[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-substrate"
version = "0.2.0"
description = "AlgoVoi agentic-payments substrate -- JCS canonicalisation, action_ref, composite trust-query, compliance receipts, audit chain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "AlgoVoi", email = "chopmob@gmail.com" },
]
keywords = [
  "x402", "ap2", "a2a", "mpp",
  "jcs", "rfc8785", "canonicalisation",
  "agentic-payments", "compliance",
  "audit-chain", "trust-query",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "rfc8785>=0.1.4",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-cov>=4",
]

[project.urls]
Homepage = "https://api.algovoi.co.uk"
Documentation = "https://docs.algovoi.co.uk/canonicalisation-substrate"
Repository = "https://github.com/chopmob-cloud/algovoi-substrate"
Issues = "https://github.com/chopmob-cloud/algovoi-substrate/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_substrate*"]

[tool.setuptools.package-data]
algovoi_substrate = ["py.typed", "vectors/*.json"]
